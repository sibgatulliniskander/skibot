[project]
name = "skibot"
version = "0.1.0"
description = "Road to Master — collecte, features, analyse et dashboard data-driven pour LoL"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "scipy>=1.13",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
skibot = "skibot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skibot*"]

[tool.ruff]
line-length = 100
target-version = "py312"
