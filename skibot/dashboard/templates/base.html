<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skibot — Road to Master</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #000;
    --panel: rgba(255, 255, 255, .05);
    --panel-border: rgba(255, 255, 255, .09);
    --text: #f5f5f7;
    --muted: #86868b;
    --accent: #2997ff;
    --accent-2: #d95926;                 /* série 2 — paire validée CVD avec l'accent */
    --bar-low: rgba(41, 151, 255, .30);  /* même hue, atténué : semaines < 50 % */
    --grid: rgba(255, 255, 255, .06);
    --grid-strong: rgba(255, 255, 255, .22);
    --grad: linear-gradient(96deg, #2997ff 0%, #6a7bff 55%, #a972ff 100%);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(640px 440px at 15% -5%, rgba(41, 151, 255, .16), transparent 70%),
      radial-gradient(720px 520px at 85% 12%, rgba(169, 114, 255, .11), transparent 70%);
  }

  /* ---- barre de navigation fixe (blur) ---- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(22px) saturate(1.4);
    background: rgba(8, 10, 18, .72);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .topbar-inner {
    max-width: 1040px; margin: 0 auto; padding: 12px 28px;
    display: flex; align-items: center; gap: 24px;
  }
  .brand {
    font-weight: 700; font-size: 17px; letter-spacing: -.02em; text-decoration: none;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .topbar nav { margin-left: auto; display: flex; gap: 4px; }
  .topbar nav a {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 6px 12px; border-radius: 999px; transition: color .18s, background .18s;
  }
  .topbar nav a:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
  .topbar nav a.active { color: var(--text); background: rgba(255, 255, 255, .1); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 28px 60px; }

  .eyebrow {
    text-align: center; letter-spacing: .18em; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; margin-top: 14px;
  }
  .hero {
    text-align: center; font-weight: 700; letter-spacing: -.03em;
    font-size: clamp(44px, 7vw, 80px); line-height: 1.08; margin: 8px 0 10px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .hero-sub {
    text-align: center; color: var(--muted); font-size: 17px;
    max-width: 640px; margin: 0 auto 34px;
  }
  .hero-sub strong { color: var(--text); }

  .rail-wrap { max-width: 760px; margin: 0 auto 8px; }
  .rail {
    position: relative; height: 6px; border-radius: 999px;
    background: rgba(255, 255, 255, .10); overflow: visible;
  }
  .rail-fill {
    height: 100%; border-radius: 999px; background: var(--grad);
    box-shadow: 0 0 18px rgba(41, 151, 255, .55);
  }
  .rail-dot {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 14px rgba(255, 255, 255, .8);
  }
  .rail-labels {
    display: flex; justify-content: space-between; margin-top: 10px;
    color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
  }
  .rail-labels .done { color: var(--text); }

  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin: 38px 0 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 20px 24px; backdrop-filter: blur(18px);
    transition: border-color .2s;
  }
  .card:hover { border-color: rgba(255, 255, 255, .16); }
  .card .label {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: .1em; font-weight: 600;
  }
  .card .value { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 22px; padding: 24px 26px; margin-bottom: 18px;
    backdrop-filter: blur(18px);
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); font-weight: 600; margin-bottom: 16px;
  }
  .chip {
    display: inline-block; width: 9px; height: 9px; border-radius: 3px;
    margin-right: 7px; vertical-align: 1px;
  }

  /* ---- cartes d'effets (vue Analyste) ---- */
  .effect-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .effect {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 18px 20px; backdrop-filter: blur(18px);
    transition: border-color .2s, transform .2s;
  }
  .effect:hover { border-color: rgba(255, 255, 255, .18); transform: translateY(-2px); }
  .effect h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .effect .compare { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .effect .note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    letter-spacing: .02em;
  }
  .badge.levier { color: #7cc0ff; background: rgba(41, 151, 255, .13); }
  .badge.meca { color: var(--muted); background: rgba(255, 255, 255, .07); }
  .badge.ok { color: #5fdba7; background: rgba(62, 207, 142, .13); }
  .badge.warn { color: #e8bd6d; background: rgba(224, 166, 63, .15); }
  .badge.bad { color: #ff9a97; background: rgba(229, 72, 77, .15); }
  .badge.neutral { color: var(--text); background: rgba(255, 255, 255, .09); }

  .consigne-statement { font-size: 19px; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: none; }
  th {
    color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .W { color: #4da3ff; font-weight: 700; } .L { color: var(--muted); font-weight: 700; }

  .audit { padding: 14px 0; border-bottom: 1px solid var(--grid); }
  .audit:last-child { border-bottom: none; }
  .audit-head { font-weight: 600; margin-bottom: 4px; }
  .audit ul { margin: 6px 0 6px 20px; }
  .fact-ids { color: var(--muted); font-size: 11px; }
  .audit-lim { color: var(--muted); font-size: 12px; font-style: italic; }

  .chart-wrap { position: relative; height: 320px; }
  .chart-wrap-sm { position: relative; height: 170px; }

  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    margin-top: 40px; line-height: 1.7;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">skibot</a>
    <nav>
      <a href="/" class="{{ 'active' if page == 'public' else '' }}">Public</a>
      <a href="/interne" class="{{ 'active' if page == 'interne' else '' }}">Interne</a>
      <a href="/audits" class="{{ 'active' if page == 'audits' else '' }}">Auditor</a>
      <a href="/analyse" class="{{ 'active' if page == 'analyse' else '' }}">Analyste</a>
    </nav>
  </div>
</header>
<div class="wrap">
  {% block content %}{% endblock %}
  <footer>
    Données API Riot, post-game uniquement · aucune assistance in-game · aucun chiffre estimé
    · dernière game : {{ summary.last_game }}
  </footer>
</div>
</body>
</html>
